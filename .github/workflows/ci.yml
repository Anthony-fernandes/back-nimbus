name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stratos_test
          POSTGRES_USER: stratos
          POSTGRES_PASSWORD: stratos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DEBUG: "True"
      SECRET_KEY: "ci-secret-key-not-for-production"
      DATABASE_URL: "postgresql://stratos:stratos@localhost:5432/stratos_test"
      REDIS_URL: "redis://localhost:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:3000"
      SECURE_SSL_REDIRECT: "False"
      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check migrations are up to date
        run: python manage.py migrate --check || python manage.py migrate

      - name: Run migrations
        run: python manage.py migrate

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: python manage.py test --verbosity=2
